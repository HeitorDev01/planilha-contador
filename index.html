<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Operacional de Contagem - SA-ATC</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg: #f8fafc;
            --border: #cbd5e1;
            --text-main: #334155;
            --light-bg: #f1f5f9;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* Cabeçalho de Metadados */
        .meta-header { display: flex; gap: 20px; margin-bottom: 25px; background: var(--light-bg); padding: 15px; border-radius: 8px; flex-wrap: wrap; }
        .meta-field { flex: 1; min-width: 200px; }
        .meta-field label { display: block; font-size: 12px; font-weight: bold; text-transform: uppercase; color: #64748b; margin-bottom: 5px; }
        
        .meta-field input, .meta-field select { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid var(--border); 
            border-radius: 4px; 
            font-size: 15px; 
            box-sizing: border-box; 
            background-color: white;
        }

        /* Ações principais */
        .action-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-logout { background: #64748b; color: white; margin-left: auto; }
        .btn-logout:hover { background: #475569; }

        /* Estilização da Tabela */
        .table-container { overflow-x: auto; overflow-y: auto; max-height: 65vh; margin-top: 10px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
        thead { position: sticky; top: 0; z-index: 10; }
        th, td { border: 1px solid var(--border); padding: 6px 4px; }
        th { background-color: var(--primary); color: white; font-weight: 600; }
        .sub-header th { background-color: #334155; font-size: 12px; }
        
        .day-odd td { background-color: #ffffff; }
        .day-even td { background-color: #cbd5e1; }
        .day-cell { font-size: 18px; font-weight: bold; }
        .shift-cell { font-weight: 600; }
        .total-shift-cell { font-weight: bold; color: #000000; font-size: 15px; }
        .total-day-cell { font-weight: bold; color: #000000; font-size: 18px; }

        .counter-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .counter-value { font-weight: bold; font-size: 15px; min-width: 25px; }
        .counter-controls { display: flex; gap: 2px; }
        .btn-ctrl { width: 22px; height: 22px; padding: 0; font-size: 12px; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid #94a3b8; background: #ffffff; color: #334155; }
        .btn-ctrl:hover { background: #e2e8f0; }
        .delete-day-btn { font-size: 11px; color: #ef4444; background: none; border: none; text-decoration: underline; padding: 0; margin-top: 5px; display: inline-block; cursor: pointer; }
        #status-conexao { font-size: 12px; color: #10b981; font-weight: bold; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-top:0; margin-bottom: 5px; color: var(--primary);">Painel de Controle de Tráfego e Solicitações</h2>
        <span id="status-conexao">🟢 Sincronizado ao Vivo</span>
        
        <div class="meta-header">
            <div class="meta-field">
                <label>Órgão Selecionado</label>
                <select id="selectOrgao" onchange="trocarOrgao()">
                    <option value="SA-ATC_RE">SA-ATC RE</option>
                    <option value="SA-ATC_AO">SA-ATC AO</option>
                </select>
            </div>
            <div class="meta-field">
                <label>Mês / Ano</label>
                <input type="text" id="metaData" value="MAIO_2026" onchange="saveMeta()">
            </div>
        </div>

        <div class="action-bar">
            <button class="btn-primary" onclick="addNewDay()">+ Adicionar Próximo Dia</button>
            <button class="btn-success" onclick="exportToExcel()">Exportar para Excel (.CSV)</button>
            <button class="btn-danger" onclick="resetAll()">Zerar Tabela</button>
            <button class="btn-logout" onclick="sairDoSistema()">Sair do Sistema</button>
        </div>

        <div class="table-container" id="scrollArea">
            <table>
                <thead>
                    <tr>
                        <th rowspan="2" style="width: 60px;">DIA</th>
                        <th rowspan="2" style="width: 80px;">TURNO</th>
                        <th colspan="8">Mensagens Analisadas</th>
                        <th colspan="5">Solicitação do ATCO</th>
                        <th rowspan="2" style="width: 100px;">TOTAL POR TURNO</th>
                        <th rowspan="2" style="width: 100px;">TOTAL GERAL</th>
                    </tr>
                    <tr class="sub-header">
                        <th>FPL</th><th>ABI</th><th>CPL</th><th>MNP</th><th>CHG</th><th>DLA</th><th>CNL</th><th>RPL</th>
                        <th>RQP</th><th>MPV</th><th>APV</th><th>TPA</th><th>AFIL</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ==========================================
        // 1. COLE AQUI AS SUAS CHAVES DO FIREBASE
        // ==========================================
        const firebaseConfig = {
    apiKey: "AIzaSyCCZI4_6O-Om9W58LcaMnVYV1aed_G2i2E",
    authDomain: "contadorhtml-6a6dc.firebaseapp.com",
    databaseURL: "https://contadorhtml-6a6dc-default-rtdb.firebaseio.com",
    projectId: "contadorhtml-6a6dc",
    storageBucket: "contadorhtml-6a6dc.firebasestorage.app",
    messagingSenderId: "176518740942",
    appId: "1:176518740942:web:cf08203360f4e3e1c7099f",
    measurementId: "G-0CQYG5TZ3M"
  };


        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ==========================================
        // 2. SEGURANÇA E LOGIN
        // ==========================================
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                // Só carrega os dados se estiver logado
                inicializarFirebase();
            }
        });

        function sairDoSistema() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'login.html';
            });
        }

        // ==========================================
        // 3. VARIÁVEIS DA TABELA
        // ==========================================
        const msgColumns = ['FPL', 'ABI', 'CPL', 'MNP', 'CHG', 'DLA', 'CNL', 'RPL'];
        const atcoColumns = ['RQP', 'MPV', 'APV', 'TPA', 'AFIL'];
        const allFields = [...msgColumns, ...atcoColumns];
        const shifts = ['Manhã', 'Tarde', 'Noite'];
        
        let db = {}; 
        let dbRefMatriz = null;
        let dbRefMeta = null;

        // ==========================================
        // 4. SINCRONIZAÇÃO EM TEMPO REAL POR ÓRGÃO
        // ==========================================
        function inicializarFirebase() {
            // Desconecta da tabela anterior caso o usuário troque de órgão
            if(dbRefMatriz) dbRefMatriz.off();
            if(dbRefMeta) dbRefMeta.off();

            // Pega qual órgão está selecionado no dropdown
            const orgaoAtual = document.getElementById('selectOrgao').value;
            
            // Define o novo caminho no banco de dados
            dbRefMatriz = database.ref('atc_painel/dados/' + orgaoAtual + '/matriz');
            dbRefMeta = database.ref('atc_painel/dados/' + orgaoAtual + '/meta');

            dbRefMatriz.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    db = data;
                } else {
                    db = {};
                    initDayData(1); // Cria o dia 1 automaticamente se a tabela for nova
                    saveToFirebase();
                }
                renderMatrix();
            });

            dbRefMeta.on('value', (snapshot) => {
                const meta = snapshot.val();
                if(meta && meta.data) {
                    document.getElementById('metaData').value = meta.data;
                }
            });
        }

        // Função disparada quando o usuário troca o órgão na tela
        function trocarOrgao() {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="16">Carregando dados do órgão...</td></tr>';
            inicializarFirebase();
        }

        function saveToFirebase() {
            if(dbRefMatriz) dbRefMatriz.set(db);
        }

        function saveMeta() {
            if(dbRefMeta) {
                dbRefMeta.set({
                    data: document.getElementById('metaData').value
                });
            }
        }

        // ==========================================
        // 5. REGRAS DA TABELA
        // ==========================================
        function initDayData(dayNum) {
            db[dayNum] = {};
            shifts.forEach(shift => {
                db[dayNum][shift] = {};
                allFields.forEach(field => {
                    db[dayNum][shift][field] = 0;
                });
            });
        }

        function addNewDay() {
            const currentDays = Object.keys(db).map(Number);
            const nextDay = currentDays.length > 0 ? Math.max(...currentDays) + 1 : 1;
            initDayData(nextDay);
            saveToFirebase();
            const scrollArea = document.getElementById('scrollArea');
            setTimeout(() => { scrollArea.scrollTop = scrollArea.scrollHeight; }, 50);
        }

        function deleteDay(dayNum) {
            if(confirm(`Remover permanentemente o DIA ${dayNum}? (Isso apagará para todos da equipe neste órgão!)`)) {
                delete db[dayNum];
                saveToFirebase();
            }
        }

        function resetAll() {
            if(confirm("⚠️ TEM CERTEZA QUE DESEJA EXCLUIR TUDO NESTE ÓRGÃO?\n\nIsso apagará a tabela inteira!")) {
                db = {};
                initDayData(1);
                saveToFirebase();
            }
        }

        function updateValue(day, shift, field, delta) {
            if (db[day] && db[day][shift]) {
                let current = db[day][shift][field] || 0;
                if (current + delta >= 0) {
                    db[day][shift][field] = current + delta;
                    saveToFirebase();
                }
            }
        }

        function renderMatrix() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const sortedDays = Object.keys(db).map(Number).sort((a, b) => a - b);

            sortedDays.forEach((day, indexList) => {
                let totalDayCount = 0;
                const rowColorClass = (indexList % 2 === 0) ? 'day-odd' : 'day-even';
                
                shifts.forEach(s => {
                    allFields.forEach(f => {
                        totalDayCount += (db[day][s][f] || 0);
                    });
                });

                shifts.forEach((shift, index) => {
                    let tr = document.createElement('tr');
                    tr.className = rowColorClass; 
                    
                    if (index === 0) {
                        tr.innerHTML += `
                            <td rowspan="3" class="day-cell">
                                ${day}
                                <br><button class="delete-day-btn" onclick="deleteDay(${day})">Excluir</button>
                            </td>
                        `;
                    }

                    tr.innerHTML += `<td class="shift-cell">${shift}</td>`;

                    let totalShiftCount = 0;
                    allFields.forEach(field => {
                        const val = db[day][shift][field] || 0;
                        totalShiftCount += val;

                        tr.innerHTML += `
                            <td>
                                <div class="counter-box">
                                    <span class="counter-value">${val}</span>
                                    <div class="counter-controls">
                                        <button class="btn-ctrl" onclick="updateValue(${day}, '${shift}', '${field}', 1)">+</button>
                                        <button class="btn-ctrl" onclick="updateValue(${day}, '${shift}', '${field}', -1)">-</button>
                                    </div>
                                </div>
                            </td>
                        `;
                    });

                    tr.innerHTML += `<td class="total-shift-cell">${totalShiftCount}</td>`;

                    if (index === 0) {
                        tr.innerHTML += `<td rowspan="3" class="total-day-cell">${totalDayCount}</td>`;
                    }

                    tbody.appendChild(tr);
                });
            });
        }

        function exportToExcel() {
            const orgaoAtual = document.getElementById('selectOrgao');
            const nomeOrgao = orgaoAtual.options[orgaoAtual.selectedIndex].text;
            const dataRef = document.getElementById('metaData').value;
            
            let csv = `ORGAO: ${nomeOrgao};MES/ANO: ${dataRef}\n`;
            csv += `DIA;TURNO;${allFields.join(';')};TOTAL POR TURNO;TOTAL GERAL\n`;

            const sortedDays = Object.keys(db).map(Number).sort((a, b) => a - b);
            sortedDays.forEach(day => {
                let totalDayCount = 0;
                shifts.forEach(s => allFields.forEach(f => totalDayCount += (db[day][s][f] || 0)));

                shifts.forEach((shift, index) => {
                    let row = [day, shift];
                    let totalShiftCount = 0;
                    allFields.forEach(field => {
                        let val = db[day][shift][field] || 0;
                        totalShiftCount += val;
                        row.push(val);
                    });
                    row.push(totalShiftCount);
                    row.push(index === 0 ? totalDayCount : "");
                    csv += row.join(';') + '\n';
                });
            });

            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `Relatorio_${nomeOrgao}_${dataRef}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
