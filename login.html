<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Operacional</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --bg: #f8fafc;
            --border: #cbd5e1;
            --text-main: #334155;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        .login-card h2 { color: var(--primary); margin-top: 0; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #64748b; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 15px; min-height: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acesso Restrito</h2>
        <p style="font-size: 14px; color: #64748b; margin-bottom: 25px;">Painel de Contagem ATC</p>
        
        <div class="input-group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="usuario@atc.com">
        </div>
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="••••••••">
        </div>
        
        <button onclick="fazerLogin()">Entrar</button>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <script>
        // ==========================================
        // COLE AQUI AS SUAS CHAVES DO FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_SENDER",
            appId: "SEU_APP"
        };

        firebase.initializeApp(firebaseConfig);

        function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.innerText = "Autenticando...";

            firebase.auth().signInWithEmailAndPassword(email, senha)
                .then(() => {
                    // Se a senha estiver certa, envia para a planilha!
                    window.location.href = 'index.html'; 
                })
                .catch((error) => {
                    errorMsg.innerText = "E-mail ou senha incorretos.";
                });
        }
    </script>
</body>
</html>
